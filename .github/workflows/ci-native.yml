name: ci-native

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: PHP proof
        run: php --version
      - name: Syntax check
        run: php -l bin/stakeholder.php
      - name: Contract tests
        run: bash tests/test_cli.sh
