name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli bash
      - name: Validate scaffold contract
        run: python3 scripts/validate_scaffold.py
      - name: Syntax check
        run: php -l bin/stakeholder.php
      - name: Contract tests
        run: bash tests/test_cli.sh
