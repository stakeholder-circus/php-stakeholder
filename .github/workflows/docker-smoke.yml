name: docker-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t php-stakeholder .
      - name: Registry smoke
        run: docker run --rm php-stakeholder --list-values
      - name: JSON smoke
        run: docker run --rm php-stakeholder --output-format json --focus-family code_analyzer --seed 123
      - name: Modern-core smoke
        run: docker run --rm php-stakeholder --output-format json --focus-family platform_engineering --seed 456
      - name: Experimental provider fail-fast
        run: |
          if docker run --rm php-stakeholder --experimental-provider local-demo; then
            echo "expected fail-fast"
            exit 1
          fi
